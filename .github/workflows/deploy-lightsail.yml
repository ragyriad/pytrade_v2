name: Deploy demo to Lightsail

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pytrade-lightsail-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.LIGHTSAIL_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload application source
        shell: bash
        run: |
          rsync -az --delete \
            --exclude ".env" \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude "dist" \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ ubuntu@${{ secrets.LIGHTSAIL_HOST }}:/opt/pytrade/

      - name: Build, migrate, and restart
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ secrets.LIGHTSAIL_HOST }} <<'EOF'
            set -euo pipefail
            cd /opt/pytrade

            docker compose build --pull
            docker compose up -d db

            set -a
            . ./.env
            set +a

            until docker compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
              sleep 2
            done

            docker compose run --rm migrate
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF
