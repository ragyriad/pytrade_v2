name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run for the same branch when a newer commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The production build imports database modules while collecting route
    # metadata. postgres-js validates this URL during module initialization,
    # but no CI build step connects to it.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pytrade_ci

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build all packages
        run: pnpm build

      # The API imports workspace packages whose type declarations are created
      # by the build above.
      - name: Type-check API
        run: pnpm typecheck:api

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Runs unit/component, integration, and browser test suites.
      - name: Run all tests
        run: pnpm test:ci

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
