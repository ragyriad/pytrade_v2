services:
  postgres-integration:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pytrade_test
      POSTGRES_USER: pytrade_test
      POSTGRES_PASSWORD: pytrade_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pytrade_test -d pytrade_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
